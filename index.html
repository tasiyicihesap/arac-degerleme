<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Araç Değerleme Sistemi</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; }
    form { display: flex; flex-direction: column; }
    input { margin: 10px 0; padding: 10px; font-size: 1rem; }
    button { padding: 10px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Araç Değerleme Sistemi</h1>
    <form id="valuationForm">
      <label for="brand">Marka:</label>
      <input type="text" id="brand" name="brand" required>
      
      <label for="model">Model:</label>
      <input type="text" id="model" name="model" required>
      
      <label for="year">Üretim Yılı:</label>
      <input type="number" id="year" name="year" required>
      
      <label for="kilometer">Kilometre:</label>
      <input type="number" id="kilometer" name="kilometer" required>
      
      <button type="button" onclick="evaluatePrice()">Değerle</button>
    </form>
    <div class="result" id="result"></div>
  </div>

  <script>
    function evaluatePrice() {
      const year = parseInt(document.getElementById('year').value);
      const kilometer = parseInt(document.getElementById('kilometer').value);
      
      let basePrice = 200000; // Örnek temel fiyat
      const ageFactor = (new Date().getFullYear() - year) * 1000; // Yıl etkisi
      const kmFactor = kilometer * 0.1; // Kilometre etkisi
      
      const finalPrice = basePrice - ageFactor - kmFactor;
      
      document.getElementById('result').innerText = 
        `Tahmini Araç Değeri: ${finalPrice.toFixed(2)} TL`;
    }
  </script>
</body>
</html>
